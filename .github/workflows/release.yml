name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a test build, e.g. 1.2.3 (no release is created)'
        required: true
        default: '0.0.0'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: windows-2025
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $label = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
              $label = $env:INPUT_VERSION
          }
          if ($label -notmatch '^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?(?:-([0-9A-Za-z.-]+))?$') {
              throw "Version '$label' is not in the form MAJOR.MINOR.PATCH[.BUILD][-suffix]"
          }
          $parts = 1..4 | ForEach-Object { if ($Matches[$_]) { [int]$Matches[$_] } else { 0 } }
          if ($parts | Where-Object { $_ -gt 65535 }) {
              throw "Each version part must be 65535 or less: '$label'"
          }
          $fileVersion = $parts -join '.'
          $prerelease = [bool]$Matches[5]
          "label=$label"             >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $label (file version $fileVersion, prerelease: $prerelease)"

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - uses: nuget/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2

      - name: Restore NuGet packages
        run: nuget restore src\netdirect.sln -PackagesDirectory packages

      - name: Build
        run: >
          msbuild src\netdirect.sln /m /nologo /v:minimal
          /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          /p:NdVersion=${{ steps.version.outputs.file_version }}

      - name: Package
        shell: pwsh
        run: >
          .github\scripts\package.ps1
          -Version ${{ steps.version.outputs.label }}
          -FileVersion ${{ steps.version.outputs.file_version }}
          -Platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-usb4-rdma-${{ steps.version.outputs.label }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # Replace the per-platform checksum files with one covering every archive.
          $sums = Get-ChildItem artifacts -Filter 'SHA256SUMS-*.txt' | Sort-Object Name | Get-Content
          Remove-Item artifacts\SHA256SUMS-*.txt
          Set-Content artifacts\SHA256SUMS.txt $sums -Encoding ascii

          $files = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:TAG @files --clobber
          } else {
              $flags = @('--verify-tag', '--generate-notes', '--title', $env:TAG)
              if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
              gh release create $env:TAG @files @flags
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
